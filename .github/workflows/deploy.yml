name: Déployer site stable et aperçu dev
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la version stable
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Récupérer la version de développement
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compiler le site stable
        working-directory: stable
        run: |
          mkdir -p public/assets
          cp -R assets/. public/assets/
          npm ci
          npm run build
      - name: Compiler l'aperçu dev
        working-directory: development
        run: |
          mkdir -p public/assets
          cp -R assets/. public/assets/
          npm ci
          npx tsc -b
          npx vite build --base=/Test/preview/
      - name: Réunir les deux sites
        run: |
          mkdir -p stable/dist/preview
          cp -R development/dist/. stable/dist/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
