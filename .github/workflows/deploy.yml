name: Déployer la PWA React
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Préparer les illustrations
        run: |
          mkdir -p public/assets
          cp -R assets/. public/assets/
          curl -fLsS https://raw.githubusercontent.com/adrienutile/Speedrun-timer-Dofus-retro/main/icon-192.png -o public/icon-192.png
          curl -fLsS https://raw.githubusercontent.com/adrienutile/Speedrun-timer-Dofus-retro/main/icon-512.png -o public/icon-512.png
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
