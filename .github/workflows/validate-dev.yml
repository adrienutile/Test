name: Tests dev (sans publication)
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer les illustrations
        run: |
          mkdir -p public/assets
          cp -R assets/. public/assets/
      - run: npm install
      - run: npm run build
      - run: npm test
